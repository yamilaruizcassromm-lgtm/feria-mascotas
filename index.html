<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feria de Mascotas - Gestión de Adopciones</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Librería oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <h1>🐾 Refugio Patitas - Control de Feria de Mascotas</h1>
        <p>Gestión de animales disponibles y adoptados</p>
    </header>

    <main class="contenedor">
        <!-- Sección de Formulario (Crear y Modificar) -->
        <section class="tarjeta">
            <h2 id="titulo-formulario">Registrar Nuevo Animal</h2>
            <form id="form-animal">
                <input type="hidden" id="animal-id">
                
                <div class="campo">
                    <label for="nombre">Nombre del animal:</label>
                    <input type="text" id="nombre" placeholder="Ej: Toby" required>
                </div>

                <div class="campo">
                    <label for="especie">Especie:</label>
                    <input type="text" id="especie" placeholder="Ej: Perro, Gato, Conejo" required>
                </div>

                <div class="campo">
                    <label for="edad_meses">Edad (en meses):</label>
                    <input type="number" id="edad_meses" min="0" placeholder="Ej: 6" required>
                </div>

                <div class="campo">
                    <label for="fecha_ingreso">Fecha de ingreso:</label>
                    <input type="date" id="fecha_ingreso" required>
                </div>

                <div class="campo">
                    <label for="estado">Estado:</label>
                    <select id="estado" required>
                        <option value="disponible">Disponible</option>
                        <option value="adoptado">Adoptado</option>
                    </select>
                </div>

                <div class="botones-form">
                    <button type="submit" id="btn-guardar" class="btn-primario">Guardar Registro</button>
                    <button type="button" id="btn-cancelar" class="btn-secundario oculto">Cancelar Edición</button>
                </div>
            </form>
        </section>

        <!-- Sección de Listado y Filtro -->
        <section class="tarjeta">
            <div class="cabecera-lista">
                <h2>Listado de Animales</h2>
                <div class="filtro-box">
                    <label for="filtro-estado">Filtrar por estado:</label>
                    <select id="filtro-estado">
                        <option value="todos">Todos</option>
                        <option value="disponible">Solo Disponibles</option>
                        <option value="adoptado">Solo Adoptados</option>
                    </select>
                </div>
            </div>

            <div class="tabla-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Especie</th>
                            <th>Edad (meses)</th>
                            <th>Fecha de ingreso</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-animales">
                        <!-- Los registros se cargan dinámicamente aquí -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
